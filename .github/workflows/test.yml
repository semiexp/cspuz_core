name: Run tests

on:
  push:
    branches: ["main"]
  pull_request: {}
  schedule:
    - cron: "0 15 * * FRI"  # weekly test: every Saturday 00:00 JST

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  styles:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Setup environment
      run: rustup update
    - name: Run rustfmt
      run: |
        rustup component add rustfmt
        ./format.sh --check

        python3 tools/check_puzzles_order.py

        python3 tools/add_backend_tests.py --check
  rust-x86-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Setup environment
      run: rustup update
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
  rust-x86-latest-glucose-rs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Setup environment
      run: rustup update
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: CSPUZ_CORE_DEFAULT_BACKEND=glucose_rs cargo test --verbose --features experimental-backend-glucose-rs
  rust-x86-latest-no-default-features:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Setup environment
      run: rustup update
    - name: Build
      run: cargo build --verbose --no-default-features
    - name: Run tests
      run: cargo test --verbose --no-default-features
  rust-wasm-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22.x'
    - name: Setup environment
      run: |
        rustup target add wasm32-unknown-emscripten
        cd ${{ runner.temp }}
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        git checkout 35659964bc2762fffec0d257997fb61475f765b7
        ./emsdk install 6.0.12
        ./emsdk activate 6.0.12
    - name: Build
      run: |
        source ${{ runner.temp }}/emsdk/emsdk_env.sh
        cargo build --target wasm32-unknown-emscripten --verbose --no-default-features
    - name: Run tests
      run: |
        mkdir ${{ runner.temp }}/test
        cp target/wasm32-unknown-emscripten/debug/deps/cspuz_solver_backend.js ${{ runner.temp }}/test/cspuz_solver_backend.mjs
        cp target/wasm32-unknown-emscripten/debug/deps/cspuz_solver_backend.wasm ${{ runner.temp }}/test
        cp tests/test_cspuz_solver_backend.js ${{ runner.temp }}/test
        cd ${{ runner.temp }}/test
        node test_cspuz_solver_backend.js
