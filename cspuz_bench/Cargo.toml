[package]
name = "cspuz_bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "cspuz_bench"
crate-type = ["lib"]

[features]
default = []
experimental-backend-glucose-rs = ["cspuz_rs/experimental-backend-glucose-rs", "cspuz_rs_puzzles/experimental-backend-glucose-rs"]

[dependencies]
cspuz_rs = { path = "../cspuz_rs", default-features = false }
cspuz_rs_puzzles = { path = "../cspuz_rs_puzzles", default-features = false }
json = "0.12.4"
